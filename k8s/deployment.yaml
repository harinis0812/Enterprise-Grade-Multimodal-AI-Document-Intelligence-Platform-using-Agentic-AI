apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuai-backend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: docuai-backend

  template:
    metadata:
      labels:
        app: docuai-backend

    spec:
      containers:

        - name: docuai-backend

          image: docuai-backend:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://docuai:docuai_password@docuai-postgres:5432/docuai"

            - name: MLFLOW_TRACKING_URI
              value: "mlruns"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "1000m"
              memory: "2Gi"
