apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docuai-backend
  template:
    metadata:
      labels:
        app: docuai-backend
    spec:
      containers:
        - name: docuai-backend
          image: docuai-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: docuai-backend-service
spec:
  selector:
    app: docuai-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP