apiVersion: apps/v1
kind: Deployment
metadata:
  name: docuai-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docuai-backend
  template:
    metadata:
      labels:
        app: docuai-backend
    spec:
      containers:
        - name: docuai-backend
          image: docuai-backend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: docuai-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: docuai-secrets
                  key: JWT_SECRET_KEY
            - name: MLFLOW_TRACKING_URI
              value: "mlruns"

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5