apiVersion: v1
kind: Secret
metadata:
  name: docuai-secrets
type: Opaque
stringData:
  POSTGRES_DB: "docuai"
  POSTGRES_USER: "docuai"
  POSTGRES_PASSWORD: "replace_with_secure_postgres_password"
  DATABASE_URL: "postgresql://docuai:replace_with_secure_postgres_password@docuai-postgres:5432/docuai"
  JWT_SECRET_KEY: "replace_with_secure_jwt_secret_key"
